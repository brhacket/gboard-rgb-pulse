name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-44.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-44.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-44.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-44.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-44.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-44.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Settings delivery and all-off cleanup test build. Replaces cached world-readable preferences with UID-restricted private settings IPC. Settings are fetched off the UI thread, applied on the keyboard thread and acknowledged by revision. The editor distinguishes local saves from Gboard-confirmed settings. Notifications are restricted to module-signed senders. Stale replies cannot confirm a newer save. Failed reads disable module effects instead of retaining an old configuration.

          All-off restores native backgrounds/letter colors, removes module overlays, invalidates key drawing caches and cancels effect/scan callbacks, including when the keyboard is hidden or no panel is bound. Adds a confirmed Turn everything off & apply action. Gboard’s own native press animation is intentionally left intact. No automatic demos or unconfirmed restarts.

          **Installation:** Fresh test signing key: uninstall the previous module first (saved settings are lost), install, enable in LSPosed/Vector with Gboard in scope, and reboot once to unload old injected hooks. Open the module, use Turn everything off & apply, then open the real test keyboard and look for Gboard confirmed: all module effects off. Next enable your desired effects and Apply / restart > Save only. If NOT confirmed persists, do not treat the settings as applied. Check module scope and reopen Gboard. Keep a backup keyboard enabled.

          Requires Android 13+ and LSPosed/Vector. Automated policy tests, desktop Skia shader checks, archive checks and APK signature verification are required before publication. Android cross-process delivery, device rendering and letter tint remain device-unverified. This build addresses concrete transport/cleanup faults; it does not claim a confirmed phone fix. Each CI build uses a fresh signing key.
          NOTES
          gh release create "test-44-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-44.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 44.0 — test build' --notes-file release-notes.md
