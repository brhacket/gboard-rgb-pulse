name: APK checks

on:
  push:
    branches: ['arena/01a106a7-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a106a7-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: |
          set +e
          bash RGBPulse/test.sh > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -E "error:|Error|Exception|Traceback|FAIL|assert" /tmp/test.log | head -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 6 /tmp/test.log | while IFS= read -r line; do echo "::error::tail: $line"; done
            exit "$status"
          fi
          cat /tmp/test.log
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: |
          set +e
          bash RGBPulse/build.sh ../Gboard-RGB-Pulse-1.0.3.apk > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -E "error:|Error:|Exception" /tmp/build.log | head -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 6 /tmp/build.log | while IFS= read -r line; do echo "::error::tail: $line"; done
            exit "$status"
          fi
          cat /tmp/build.log
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-1.0.3.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-1.0.3.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-1.0.3.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-1.0.3.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-1.0.3.apk
            APK-verification.txt
            SHA256SUMS.txt
