name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-43.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-43.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-43.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-43.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-43.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-43.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Targeted letter-color test build. Tracks every verified key descendant and hooks declared onDraw methods as well as draw/display-list recording. This addresses a missing path where custom Gboard child views record glyphs outside the key-root scope. Removes stale ownership on child recycling, restores nested scopes, and leaves text shapes/fonts/positions unchanged. No animation or palette changes from v42.

          Optional diagnostics report scoped view/method counts, the first scoped paint call and bitmap/render-node observations. They never log typed text. If colors still do not change, enable Detailed layout logs, Apply & restart, tap a few keys and share only LSPosed lines beginning RGBPulse legend with the Gboard version. Bitmap observations alone do not prove letters are bitmap-based.

          **Installation:** Fresh test signing key: uninstall the previous module first (saved settings are lost), install, enable in LSPosed/Vector with Gboard in scope, enable ripple, choose letter active/inactive colors, and Apply / restart > Save & restart. Keep a backup keyboard enabled. Native Gboard behavior remains unverified on a device.

          Requires Android 13+ and LSPosed/Vector. This is a test build, not device-verified. Automated policy tests, desktop Skia shader checks, archive checks and APK signature verification are required before publication. Each CI build uses a fresh key, so upgrades between test builds also require uninstalling the previous test build.
          NOTES
          gh release create "test-43-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-43.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 43.0 — test build' --notes-file release-notes.md
