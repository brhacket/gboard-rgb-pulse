name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-45.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-45.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-45.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-45.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-45.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-45.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Tileless keys and distinct motion test build. Hide all key tiles defaults on while effects are enabled: suppresses native background drawables on verified keys and their descendants, removes module faces and ripple boxes, and leaves letters/icons and touch targets in place. Tracks live theme replacements, restores recycled views and restores stock backgrounds when both effects are off. Backgrounds painted directly by a custom renderer rather than a View background may need further device-specific work.

          Adds four visibly different background motions: Lateral sweep (sideways light sheets), Soft spotlight (stationary breathing pool), Crossing ribbons (diagonal bands), and Rising curtain (upward wash). Existing styles remain available; shuffle includes the new styles. All effects remain explicit Apply, with Gboard revision confirmation. No automatic demos or restarts.

          **Installation:** Fresh signing key: uninstall the previous test module first (saved settings are lost), install v45, enable for Gboard in LSPosed/Vector and reboot once. Enable ripple and/or background animations, keep Hide all key tiles on, then Apply / restart > Save only. Wait for Gboard confirmation. Under Background animation select one of the four new styles. Keep a backup keyboard enabled.

          Android 13+ required. Policy/source tests, desktop Skia checks (including distinct alpha geometry for the four new styles), Android compilation and APK signature/archive verification run before publication. These checks do not verify rendering on your phone. Gboard toolbar controls are intentionally untouched.
          NOTES
          gh release create "test-45-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-45.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 45.0 — test build' --notes-file release-notes.md
