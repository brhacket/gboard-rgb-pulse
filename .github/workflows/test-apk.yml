name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-42.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-42.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-42.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-42.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-42.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-42.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Test build: constant-speed ripple travel (no movement ease-out), soft opacity fades retained. Four ripple styles: Row flow, Soft echo, Wide glow and Touch pulse. Independent active/inactive colors for borders and letters, border width from 0.5–3dp, live color swatches, hex input and Material-tonal color presets. Background hue controls now show swatches and palette previews. Three new tap animations: Material bloom, Diffused ring and Tonal orbit. Existing saved animation IDs remain valid.

          Letter-color handling now includes native drawGlyphs and a reversible TextView-legend adapter, in addition to Canvas text hooks. Custom paints use the selected colors rather than the old automatic white tint. Cached glyph/bitmap rendering that bypasses these paths still requires device validation.

          **Installation:** This APK uses a fresh test signing key. Uninstall the previous RGB Pulse module first (saved settings will be lost). Keep a backup keyboard enabled. Install and enable in LSPosed/Vector with Gboard in scope. Configure Ripple colors & border and/or Background animations, then Apply / restart > Save & restart and approve root, or Save only and reopen Gboard manually. Effects remain opt-in. Preview uses draft settings; actual Gboard uses applied settings.

          Requires Android 13+ and LSPosed/Vector. This is a test build, not device-verified. Automated policy tests, desktop Skia shader checks, archive checks and APK signature verification are required before publication. Each CI build uses a fresh key, so upgrades between test builds also require uninstalling the previous test build.
          NOTES
          gh release create "test-42-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-42.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 42.0 — test build' --notes-file release-notes.md
