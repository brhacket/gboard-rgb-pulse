name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-48.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-48.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-48.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-48.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-48.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-48.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Settings delivery is no longer dependent on Gboard opening the module ContentProvider. Apply sends a signature-permission-protected snapshot directly to the live Gboard receiver. Gboard acknowledges only after applying it via an immutable, one-shot PendingIntent to a non-exported receipt receiver. Bootstrap requests send only the module's own applied settings to the fixed Gboard package; caller payloads are ignored and requests are rate-limited. Stale snapshots are rejected. A missing reply disables effects after a bounded timeout and the UI distinguishes no live module response from missing confirmation. This is a transport redesign, not a device-confirmed fix.

          Restart is again in the sticky footer, separately confirmed. If root force-stop fails, an explicit dialog explains it and offers Android app settings. Apply alone never force-stops Gboard.

          Touch separates tap feedback from Quiet background. The new background is one fixed-size, low-contrast pool near the key, with a maximum 40dp radius and 12% peak opacity before the strength control. It replaces itself on fast typing, never grows across the keyboard or accumulates. Soft press / 160ms is the default feedback selection; effects stay opt-in. Try everyday setup stages key feedback plus quiet background, with traveling ripple and opening/closing spectacles off. It does not apply or play a demo automatically. Existing expressive/wide choices remain optional.

          **Install:** Fresh signing key: uninstall the previous test module (settings are lost), install v48, enable for Gboard in LSPosed/Vector, then reboot once. Open the actual test keyboard and Apply changes. Check the connection status. A no-live-module-reply message means this build's receiver did not answer; check module scope/reboot rather than assuming the settings applied. Keep a backup keyboard enabled.

          Automated Java/source tests, pulse shader checks, Android compilation, archive and signature verification run before publication. Android transport/LSPosed integration, force-stop permissions and phone rendering remain unverified on a device.
          NOTES
          gh release create "test-48-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-48.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 48.0 — test build' --notes-file release-notes.md
