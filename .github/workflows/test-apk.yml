name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-39.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-39.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-39.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-39.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-39.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-39.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Test build: cubic ease-out motion and quintic fades; refined ripples are now drawn in clipped per-key ViewOverlays so native key painting cannot cover them. Layout-change discovery bypasses the idle scan throttle before drawing. Background effects and Test your keyboard remain available. Apply offers Save only or confirmed Save & restart, which requests root and stops Gboard only after settings are saved. Denied/unavailable root offers manual app settings.

          **Installation:** This APK uses a fresh test signing key. Uninstall the previous RGB Pulse module first (saved module settings will be lost). Keep a backup keyboard enabled. Install and enable this module in LSPosed/Vector with Gboard in scope. Open RGB Pulse, turn on Enable ripple, optionally select background effects, then press Apply / restart. Choose Save & restart and approve root if you want Gboard force-stopped; otherwise choose Save only. Tap Test your keyboard to reopen Gboard. Idle keys intentionally retain stock Gboard styling.

          Requires Android 13+ and LSPosed/Vector. This is a test build, not device-verified. Automated policy tests, desktop Skia shader checks, archive checks and APK signature verification are required before publication. Each CI build uses a fresh key, so upgrades between test builds also require uninstalling the previous test build.
          NOTES
          gh release create "test-39-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-39.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 39.0 — test build' --notes-file release-notes.md
