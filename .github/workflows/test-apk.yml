name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-38.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-38.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-38.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-38.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-38.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-38.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Test build: restores Test your keyboard and optional background animations while keeping explicit Apply. Gboard now advances wave state before key redraws, schedules with the display refresh rather than a fixed 16ms gate, and retains the final cleanup frame. Full key discovery is throttled instead of repeated every animation frame. Background selection is preserved and respected in both the preview and the Gboard hook.

          **Installation:** This APK uses a fresh test signing key. Uninstall the previous RGB Pulse module first (saved module settings will be lost). Keep a backup keyboard enabled. Install and enable this module in LSPosed/Vector with Gboard in scope. Open RGB Pulse, turn on Enable ripple, optionally expand Background animations and enable/select an effect, then press Apply. Tap Test your keyboard to check actual Gboard with applied settings. Preview uses the draft. Restart Gboard manually or reboot only if your framework requires it.

          Requires Android 13+ and LSPosed/Vector. This is a test build, not device-verified. Automated policy tests, archive checks and APK signature verification are required before publication. Each CI build uses a fresh key, so upgrades between test builds also require uninstalling the previous test build.
          NOTES
          gh release create "test-38-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-38.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 38.0 — test build' --notes-file release-notes.md
