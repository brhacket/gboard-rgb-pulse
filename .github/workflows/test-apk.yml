name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-46.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-46.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-46.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-46.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-46.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-46.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Pulse Studio: pinned, collapsible, height-responsive preview; Ripple / Pulse / Keyboard navigation; coordinated dark surfaces and mint controls; direct Apply changes with no root prompt. Restart is tucked into troubleshooting and still requires confirmation. Settings receipt is shown as up to date or waiting for Gboard, never assumed from a local save.

          Fix: hiding key fills no longer hides ripple borders. Adds four ripple styles (Full keyboard, Rightward chase, Inward sweep, Heartbeat) and three pulse styles (Diamond echo, Velvet tide, Split horizon). Existing styles remain available.

          Optional opening/closing lighting: Soft glow, Light sweep or Edge glow, independently Off by default. Explicit preview buttons. Keys never slide or scale. Closing is best-effort during Android dismissal; it never holds the keyboard open and may be very brief or not visible when Android immediately removes the window. Turning everything off cancels lighting and restores stock styling.

          **Installation:** This test uses a fresh signing key: uninstall the previous module first (settings are lost), install v46, enable for Gboard in LSPosed/Vector and reboot once. Choose your options and press Apply changes; wait for Gboard confirmation. Opening/closing controls are under Keyboard. Keep a backup keyboard enabled.

          Android 13+ required. Policy/source tests, desktop shader checks, Android compilation and APK signature/archive verification run before publication. Android layout/accessibility, native rendering and lifecycle timing still need phone verification; no device verification is claimed.
          NOTES
          gh release create "test-46-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-46.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 46.0 — test build' --notes-file release-notes.md
