name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-47.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-47.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-47.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-47.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-47.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-47.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          A curated set of exactly ten pulse animations: Edge runner, Corner snap, Underline, Prism swipe, Four sparks, Drop ring, Split shutters, Soft press, Wide orbit and Wide aurora. The first eight use the actual tapped-key rectangle, with a finite local footprint. Pulses default to 220 ms with a separate 120–360 ms length control. At most three local pulses coexist; wide pulses replace each other. Combined opacity is capped (48% local / 28% wide before the brightness setting), instead of stacking toward white.

          Removes Rightward chase, Inward sweep and Heartbeat. Full keyboard remains; new Diamond field, Cross bloom, Diagonal weave and Checker reveal patterns cross multiple rows without pretending extra taps occurred. Native key fills and ripple borders remain independent. The praised Studio layout stays intact.

          Apply adds a ContentObserver notification path alongside broadcasts, retries notification while waiting, always releases the save-button busy state after handled errors, and confirms both settings revision and runtime version. An older injected build can no longer acknowledge current settings as up to date. The cause on the user's device is not yet confirmed.

          Dramatic optional opening/closing lighting: Ignition, Stage curtains and Horizon rise, with stronger fronts, broader geometry and 520/260 ms timing. Typing cancels the opening spectacle immediately. Closing starts visibly but Android can still dismiss the window before rendering; no forced delay or key movement is introduced.

          **Install:** Fresh test signing key: uninstall the previous module (settings are lost), install v47, enable for Gboard in LSPosed/Vector, then reboot once to load the current injected code. Press Apply changes and open the real test keyboard; wait for Gboard confirmation. All effects remain opt-in. Keep a backup keyboard enabled.

          Automated Java/source checks, production shader clipping/footprint/opacity-cap checks, Android compilation and APK signature/archive verification precede publication. These do not prove phone behavior or subjective animation quality. Apply delivery and lifecycle timing remain device-unverified.
          NOTES
          gh release create "test-47-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-47.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 47.0 — test build' --notes-file release-notes.md
