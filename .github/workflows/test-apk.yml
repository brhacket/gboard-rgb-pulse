name: Test APK

on:
  push:
    branches: ['arena/01a0f95a-gboard-rgb-pulse']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/01a0f95a-gboard-rgb-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build test APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-36.0-test.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-36.0-test.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-36.0-test.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-36.0-test.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-36.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-test
          path: |
            Gboard-RGB-Pulse-36.0-test.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Test build: explicit Apply with private draft settings, no automatic preview, no root/restart action, individually opt-in effects and corrected row-wave gating.

          **Installation:** This APK has a fresh test signing key, not the previous release key. Uninstall the existing RGB Pulse module first (saved module settings will be lost), then install this APK. Keep a backup keyboard enabled. Enable the module in LSPosed/Vector, scope Gboard, reopen the module, enable the module switch and the desired effects, then press Apply. For white row waves, enable Stock keys + white row waves and Row waves. Background tap animations and glide trails are separate opt-ins. Restart Gboard manually or reboot if required by your framework.

          Requires Android 13+ and LSPosed/Vector. This is a test build, not device-verified. Automated policy tests, archive checks and APK signature verification are required before publication. Each CI build uses a fresh key, so upgrades between test builds also require uninstalling the previous test build.
          NOTES
          gh release create "test-36-${{ github.run_id }}-${{ github.run_attempt }}" \
            Gboard-RGB-Pulse-36.0-test.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Gboard RGB Pulse 36.0 — test build' --notes-file release-notes.md
