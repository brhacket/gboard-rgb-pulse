name: Publish APK

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a106a7-gboard-rgb-pulse']

permissions:
  contents: write

concurrency:
  group: publish-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this APK is already published
        id: check
        run: |
          if [ -f Gboard-RGB-Pulse-1.1.0.apk ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'
      - name: Run policy and source tests
        if: steps.check.outputs.exists == 'false'
        run: bash RGBPulse/test.sh
      - uses: android-actions/setup-android@v4
        if: steps.check.outputs.exists == 'false'
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        if: steps.check.outputs.exists == 'false'
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build APK
        if: steps.check.outputs.exists == 'false'
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-1.1.0.apk
      - name: Verify archive and signature
        if: steps.check.outputs.exists == 'false'
        run: |
          unzip -t Gboard-RGB-Pulse-1.1.0.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-1.1.0.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-1.1.0.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-1.1.0.apk > SHA256SUMS.txt
      - name: Commit the published APK
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gboard-RGB-Pulse-1.1.0.apk APK-verification.txt SHA256SUMS.txt
          git commit -m "Publish Gboard-RGB-Pulse-1.1.0.apk with verification report"
          git push
