name: Release

on:
  push:
    branches: ['main']
    paths: ['RGBPulse/AndroidManifest.xml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run regression and policy tests
        run: bash RGBPulse/test.sh
      - name: Verify background shaders with desktop Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1
          python3 - <<'PYTEST'
          import subprocess, sys
          commands = [
              [sys.executable, '-m', 'pip', 'install', 'skia-python', 'numpy', 'pillow>=10'],
              [sys.executable, 'RGBPulse/tests/shader_test.py', '--stills'],
          ]
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode:
                  detail = result.stdout[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + detail)
                  sys.exit(result.returncode)
          PYTEST
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Locate Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build release APK
        run: bash RGBPulse/build.sh ../Gboard-RGB-Pulse-1.0.2.apk
      - name: Verify archive and signature
        run: |
          unzip -t Gboard-RGB-Pulse-1.0.2.apk
          apksigner verify --verbose --print-certs Gboard-RGB-Pulse-1.0.2.apk | tee APK-verification.txt
          aapt dump badging Gboard-RGB-Pulse-1.0.2.apk >> APK-verification.txt
          sha256sum Gboard-RGB-Pulse-1.0.2.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-RGB-Pulse-1.0.2
          path: |
            Gboard-RGB-Pulse-1.0.2.apk
            APK-verification.txt
            SHA256SUMS.txt
      - name: Publish 1.0.2 from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 \
            Gboard-RGB-Pulse-1.0.2.apk APK-verification.txt SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest \
            --title 'Gboard RGB Pulse 1.0.2' --notes-file docs/RELEASE-1.0.2.md
