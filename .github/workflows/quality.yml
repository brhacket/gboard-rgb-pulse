name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE: '34.0'

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run policy and source tests
        working-directory: RGBPulse
        run: bash test.sh
      - name: Check generated shader is current
        working-directory: RGBPulse
        run: |
          before=$(sha256sum src/dev/rgbpulse/gboard/ShaderCode.java)
          python3 embed_shader.py
          test "$before" = "$(sha256sum src/dev/rgbpulse/gboard/ShaderCode.java)"
      - name: Check shell scripts
        run: bash -n RGBPulse/build.sh RGBPulse/test.sh

  publish:
    # The session branch is the release lane; dispatch is also supported when repository permissions allow it.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0f1d9-gboard-rgb-pulse')
    needs: policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0"
      - name: Locate aapt
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Download APK signing library
        run: curl --fail --location --retry 3 -o apksig.jar https://repo1.maven.org/maven2/com/android/tools/build/apksig/8.3.37/apksig-8.3.37.jar
      - name: Build APK
        working-directory: RGBPulse
        env:
          APKSIG_JAR: ${{ github.workspace }}/apksig.jar
        run: bash build.sh "../Gboard-RGB-Pulse-${{ env.RELEASE }}.apk"
      - name: Verify APK archive
        run: unzip -t "Gboard-RGB-Pulse-${{ env.RELEASE }}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ env.RELEASE }}" \
            "Gboard-RGB-Pulse-${{ env.RELEASE }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Gboard RGB Pulse ${{ env.RELEASE }}" \
            --generate-notes
