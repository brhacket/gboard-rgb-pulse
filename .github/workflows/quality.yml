name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run policy and source tests
        working-directory: RGBPulse
        run: |
          set +e
          bash test.sh > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -E "error:|Error|Exception|Traceback|FAIL|assert" /tmp/test.log | head -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 6 /tmp/test.log | while IFS= read -r line; do echo "::error::tail: $line"; done
            exit "$status"
          fi
          cat /tmp/test.log
      - name: Check generated shader is current
        working-directory: RGBPulse
        run: |
          before=$(sha256sum src/dev/rgbpulse/gboard/ShaderCode.java)
          python3 embed_shader.py
          test "$before" = "$(sha256sum src/dev/rgbpulse/gboard/ShaderCode.java)"
      - name: Check shell scripts
        run: bash -n RGBPulse/build.sh RGBPulse/test.sh
